name: Cache
on: workflow_dispatch
jobs:
  jobx:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Set JDK & Maven
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: cahing Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository 
          key: "maven-${{ hashFiles('**/pom.xml') }}"          
      - name: Check JDK & MVN
        run: |
           java -version
           mvn -v     
      - name: App build
        run: |
           mvn compile package        
         